actions:
  veracode_static_scan:
    build:
      predependency_command: |
        apt-get update
        apt-get install -y ca-certificates \
          libc6 \
          libgcc-s1 \
          libgssapi-krb5-2 \
          libicu74 \
          libssl3t64 \
          libstdc++6 \
          tzdata \
          zlib1g
        curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 10.0 --install-dir /opt/veracode/dotnet

veracode_static_scan:
  push:
    trigger: true
    branches_to_run:
      - '*'
  pull_request:
    trigger: true
    action:
      - opened
      - synchronize
    target_branch:
      - default_branch
  analysis_on_platform: false
  break_build_policy_findings: true
  # Default policy to be used if a policy isn't already assigned to the application profile.
  policy: 'Veracode Recommended Medium + SCA'